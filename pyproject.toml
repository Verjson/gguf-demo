[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-demo"
version = "0.2.0"
description = "Local RAG vs fine-tune evaluation with MLflow, Prometheus, Postgres/pgvector, and Grafana"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gguf-demo" }]
dependencies = [
  # LLM and embeddings
  "transformers>=4.36.2,<4.45",
  "torch>=2.1.2",
  "accelerate>=0.25.0",
  "sentence-transformers>=2.2.2,<3",
  "langchain>=0.1.0,<0.2",
  "langchain-community>=0.0.10,<0.1",
  "langchain-text-splitters>=0.0.1,<0.1",
  "langchain-core>=0.1.10,<0.2",
  # Vector database
  "pgvector>=0.2.3",
  "psycopg2-binary>=2.9.9",
  "sqlalchemy>=2.0.23",
  # Document processing
  "pypdf>=4.2.0",
  "pdfplumber>=0.10.3",
  "nltk>=3.8.1",
  # Evaluation
  "datasets>=2.16.1",
  "rouge-score>=0.1.2",
  "bert-score>=0.3.13",
  "ragas>=0.1.0,<0.2",
  # Tracking / monitoring
  "mlflow>=3.1.0,<3.16",
  "prometheus-client>=0.19.0",
  # Fine-tuning
  "peft>=0.7.1,<0.12",
  # Utilities
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "tqdm>=4.66.1",
  "pandas>=2.1.4",
  "numpy>=1.26.3",
  "click>=8.1.7",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpu = [
  "bitsandbytes>=0.41.3",
]
dev = [
  "pytest>=7.4.0",
  "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.txt", "*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
