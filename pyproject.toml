[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gguf-demo"
version = "0.3.0"
description = "Local RAG vs fine-tune vs GGUF evaluation with MLflow, Prometheus, Postgres/pgvector, and Grafana"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gguf-demo" }]
dependencies = [
  # LLM and embeddings
  "transformers>=4.36.2,<4.45",
  "torch>=2.1.2",
  "accelerate>=0.25.0",
  "sentence-transformers>=2.2.2,<3",
  "langchain>=0.3.30,<0.4",
  "langchain-community>=0.0.10,<0.1",
  "langchain-text-splitters>=0.0.1,<0.1",
  "langchain-core>=0.1.10,<0.2",
  # Vector database
  "pgvector>=0.2.3",
  "psycopg2-binary>=2.9.9",
  "sqlalchemy>=2.0.23",
  # Document processing
  "pypdf>=4.2.0",
  "pdfplumber>=0.10.3",
  "nltk>=3.8.1",
  # Evaluation
  "datasets>=2.16.1",
  "rouge-score>=0.1.2",
  "bert-score>=0.3.13",
  "ragas>=0.1.0,<0.2",
  # Tracking / monitoring
  "mlflow>=3.1.0,<3.16",
  "prometheus-client>=0.19.0",
  # Fine-tuning
  "peft>=0.20,<0.21",
  # GGUF / llama.cpp Python bindings (CPU wheels from PyPI). Pinned exactly to match
  # Dockerfile.app: the image installs prebuilt wheels from an --extra-index-url that
  # is not hash-verified, so the version must be a reviewed choice, not "whatever is
  # newest at build time".
  "llama-cpp-python==0.3.34",
  "huggingface_hub>=0.20.0",
  # Utilities
  "pyyaml>=6.0.1",
  "requests>=2.31.0",
  "tqdm>=4.66.1",
  "pandas>=2.1.4",
  "numpy>=1.26.3",
  "click>=8.1.7",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
gpu = [
  "bitsandbytes>=0.41.3",
]
gguf-cuda = [
  # Documented extra-index for CUDA wheels; Dockerfile selects cu124 when GPU image.
  "llama-cpp-python==0.3.34",
]
dev = [
  "pytest>=7.4.0",
  "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.txt", "*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned deliberately. Without a select list the effective rule set is whatever the
# installed ruff version defaults to, so the finding count moves under you and "lint
# is clean" means nothing across two machines: ruff 0.16.3 reports 73 findings here
# from rules this project never opted into, against 6 for the set below.
#
# E4/E7/E9 + F are ruff's own defaults — real errors, not style. I adds import
# ordering, which is the one stylistic rule worth enforcing here because it removes a
# recurring source of noise in diffs. Widen this list deliberately, in its own PR,
# with the resulting finding count stated.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
