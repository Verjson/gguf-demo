services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg15-trixie@sha256:ffc303247d1e0135de6bc116a178d3c75c6d7f530c39d91d30d480cd4d03a9cb
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag_eval
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    # Loopback only. Every service in this stack ships demo credentials or none at
    # all (raguser/ragpass here, authenticated Grafana, unauthenticated MLflow and
    # Prometheus), so a 0.0.0.0 bind hands the LAN an open database and an open
    # metrics store. Containers still reach each other on the compose network, which
    # is unaffected: Prometheus scrapes app:8000, MLflow talks to postgres:5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d rag_eval"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    container_name: rag-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    container_name: rag-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD to a strong local secret}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Read by grafana/provisioning/datasources/prometheus.yml. The dashboards only
      # ever SELECT, so the datasource connects as a role that can only SELECT — not
      # as the database owner, which is what it used to do while executing raw SQL
      # typed into the query editor.
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafanaro}
      POSTGRES_DB: rag_eval
      POSTGRES_HOST_PORT: postgres:5432
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: rag-mlflow
    # macOS runs an AirPlay Receiver on 5000 by default, so the published port is
    # overridable and run_pipeline.sh moves off it automatically when it is taken.
    # Only the host side moves: services still reach each other on the container
    # port (http://mlflow:5000), so nothing internal depends on this number.
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://raguser:ragpass@postgres:5432/rag_eval
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow-artifacts
    volumes:
      - mlflow_data:/mlflow-artifacts
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://raguser:ragpass@postgres:5432/rag_eval
      --default-artifact-root /mlflow-artifacts
      --allowed-hosts mlflow:5000,rag-mlflow:5000,mlflow,rag-mlflow,localhost,127.0.0.1

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        # CPU is the portable default. docker-compose.gpu.yml overrides this for NVIDIA hosts.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
        LLM_MODEL: ${LLM_MODEL:-microsoft/Phi-3-mini-4k-instruct}
        LLM_REVISION: ${LLM_REVISION:-f39ac1d28e925b323eae81227eaba4464caced4e}
        EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        EMBED_REVISION: ${EMBED_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
    container_name: rag-app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
      - ./src:/app/src:ro
      - ./models:/app/models
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro
      - ./results:/app/results
      - ./pyproject.toml:/app/pyproject.toml:ro
      - huggingface_cache:/app/.cache/huggingface
      # Same artifact store the MLflow server uses. The tracking server advertises
      # a file:// root, so the app writes artifacts itself rather than uploading.
      - mlflow_data:/mlflow-artifacts
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: gguf-demo
      POSTGRES_HOST: postgres
      POSTGRES_DB: rag_eval
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      # Keep one pipeline's exporter shards. Prometheus itself retains historical
      # samples; carrying dead process files across stack starts only slows scrapes.
      RESET_METRICS: "1"
      METRICS_PORT: "8000"
      # HF_HOME must stay on the huggingface_cache named volume below. It must never
      # resolve under /app/results, which is bind-mounted to the host: a 17GB cache
      # reachable from a bind mount is one bad copy away from filling the host disk.
      HF_HOME: /app/.cache/huggingface
      # HOME outside /app so stray dotfile caches (torch hub, pip, matplotlib) cannot
      # land next to the bind-mounted results/ tree.
      HOME: /tmp/home
      MPLCONFIGDIR: /tmp/matplotlib
      TRITON_CACHE_DIR: /tmp/triton
      XDG_CONFIG_HOME: /tmp/xdg-config
      # Thread pools are sized at runtime from the CPU budget this container is
      # actually granted (src/cpu_runtime.py) rather than from the host's core
      # count, so the demo behaves the same on a laptop and on a slice of a
      # shared machine. APP_CPUS overrides both the quota and the pool.
      APP_CPUS: ${APP_CPUS:-}
      # Deliberately no OMP_WAIT_POLICY=passive here: decode issues hundreds of
      # tiny parallel regions per token, and paying a thread wake-up on each one
      # measured about 2x slower than letting idle threads spin. Limit CPU with
      # APP_CPUS rather than by making threads sleep.
      TOKENIZERS_PARALLELISM: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      # The runtime image intentionally has no git executable or .git mount. The
      # host pipeline supplies these two values so MLflow still records exactly
      # which source tree produced the run without widening the container surface.
      SOURCE_GIT_SHA: ${SOURCE_GIT_SHA:-unknown}
      SOURCE_GIT_DIRTY: ${SOURCE_GIT_DIRTY:-unknown}
      GIT_PYTHON_REFRESH: quiet
    # Guardrails so a CPU run can never exhaust the host. Without these, a Phi-3
    # load inside a 24GB WSL2 VM drives the whole VM into swap death rather than
    # failing one container. memswap_limit == mem_limit disables container swap,
    # so an over-budget run is killed immediately instead of thrashing.
    # run_pipeline.sh replaces these defaults with values sized to the host.
    mem_limit: ${APP_MEM_LIMIT:-10g}
    memswap_limit: ${APP_MEM_LIMIT:-10g}
    # 0 means no quota. Set APP_CPUS to cap CPU use on a shared machine.
    cpus: ${APP_CPUS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      prometheus:
        condition: service_started
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Persistent Prometheus exporter (eval scripts are ephemeral `exec` processes)
    command: ["python", "scripts/metrics_server.py"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  mlflow_data:
  huggingface_cache:
