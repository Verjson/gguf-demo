services:
  postgres:
    image: ankane/pgvector:latest
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag_eval
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d rag_eval"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: rag-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://raguser:ragpass@postgres:5432/rag_eval
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow-artifacts
    volumes:
      - mlflow_data:/mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://raguser:ragpass@postgres:5432/rag_eval
      --default-artifact-root /mlflow-artifacts
      --allowed-hosts '*'
      --cors-allowed-origins '*'

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        # CPU is the portable default. docker-compose.gpu.yml overrides this for NVIDIA hosts.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
        LLM_MODEL: ${LLM_MODEL:-microsoft/Phi-3-mini-4k-instruct}
        EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    container_name: rag-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./src:/app/src
      - ./models:/app/models
      - ./config:/app/config
      - ./prompts:/app/prompts
      - ./results:/app/results
      - ./pyproject.toml:/app/pyproject.toml
      - huggingface_cache:/app/.cache/huggingface
      # Same artifact store the MLflow server uses. The tracking server advertises
      # a file:// root, so the app writes artifacts itself rather than uploading.
      - mlflow_data:/mlflow-artifacts
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: gguf-demo
      POSTGRES_HOST: postgres
      POSTGRES_DB: rag_eval
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      METRICS_PORT: "8000"
      HF_HOME: /app/.cache/huggingface
      HOME: /app
      # Thread pools are sized at runtime from the CPU budget this container is
      # actually granted (src/cpu_runtime.py) rather than from the host's core
      # count, so the demo behaves the same on a laptop and on a slice of a
      # shared machine. APP_CPUS overrides both the quota and the pool.
      APP_CPUS: ${APP_CPUS:-}
      # Deliberately no OMP_WAIT_POLICY=passive here: decode issues hundreds of
      # tiny parallel regions per token, and paying a thread wake-up on each one
      # measured about 2x slower than letting idle threads spin. Limit CPU with
      # APP_CPUS rather than by making threads sleep.
      TOKENIZERS_PARALLELISM: "false"
    # Guardrails so a CPU run can never exhaust the host. Without these, a Phi-3
    # load inside a 24GB WSL2 VM drives the whole VM into swap death rather than
    # failing one container. memswap_limit == mem_limit disables container swap,
    # so an over-budget run is killed immediately instead of thrashing.
    # run_pipeline.sh replaces these defaults with values sized to the host.
    mem_limit: ${APP_MEM_LIMIT:-10g}
    memswap_limit: ${APP_MEM_LIMIT:-10g}
    # 0 means no quota. Set APP_CPUS to cap CPU use on a shared machine.
    cpus: ${APP_CPUS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
      prometheus:
        condition: service_started
    stdin_open: true
    tty: true
    # Persistent Prometheus exporter (eval scripts are ephemeral `exec` processes)
    command: ["python", "scripts/metrics_server.py"]

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  mlflow_data:
  huggingface_cache:
